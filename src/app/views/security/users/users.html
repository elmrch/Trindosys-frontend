<div class="-m-4 flex h-[calc(100vh-4rem)] flex-col border border-gray-200 bg-white md:-m-6 dark:border-gray-800 dark:bg-white/[0.03]">
  <div
    class="flex shrink-0 flex-col gap-4 border-b border-gray-200 p-6 dark:border-gray-800 md:flex-row md:items-center md:justify-between"
  >
    <div class="flex items-center gap-3">
      <div class="rounded-lg bg-brand-50 p-2 text-brand-600 dark:bg-brand-500/10 dark:text-brand-400">
        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path
            d="M16 19v-1a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v1M11 9a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM19.5 19v-1a3 3 0 0 0-2.5-2.96M15 4.13a3 3 0 0 1 0 5.75"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </div>
      <div>
        <h1 class="text-xl font-semibold text-gray-800 dark:text-white">Usuarios</h1>
        <p class="text-sm text-gray-500 dark:text-gray-400">Administra las cuentas de asesores y administradores del sistema.</p>
      </div>
    </div>

    <button
      type="button"
      class="flex items-center justify-center gap-2 rounded-lg bg-brand-500 px-4 py-2 text-sm font-semibold text-white hover:bg-brand-600"
      (click)="openCreateForm()"
    >
      <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
      </svg>
      Nuevo Usuario
    </button>
  </div>

  <div class="shrink-0 border-b border-gray-200 p-3 dark:border-gray-800">
    <div class="relative w-full md:w-80">
      <svg
        class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-gray-400"
        viewBox="0 0 24 24"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
      >
        <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.6" />
        <path d="m20 20-3-3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
      </svg>
      <input
        type="text"
        placeholder="Buscar por nombre, correo o rol..."
        [value]="searchTerm()"
        (input)="searchTerm.set($any($event.target).value)"
        class="h-9 w-full rounded-lg border border-gray-300 bg-gray-50 pl-9 pr-8 text-sm text-gray-700 placeholder:text-gray-400 focus:border-brand-500 focus:outline-none focus:ring-1 focus:ring-brand-500 dark:border-gray-700 dark:bg-gray-800 dark:text-white"
      />
    </div>
  </div>

  @if (isLoading()) {
    <p class="p-6 text-sm text-gray-500 dark:text-gray-400">Cargando...</p>
  } @else {
    <div class="min-h-0 flex-1">
      <app-user-list [users]="filteredUsers()" (edit)="openEditForm($event)" (toggleActive)="onToggleActive($event)" />
    </div>
  }
</div>

@if (isFormOpen()) {
  <app-user-form [user]="editingUser()" (saved)="onSaved()" (cancel)="closeForm()" />
}
