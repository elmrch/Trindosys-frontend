<div class="rounded-lg border border-gray-200 bg-white shadow-sm dark:border-gray-800 dark:bg-white/[0.03]">
  <!-- Header -->
  <div class="flex flex-col gap-4 border-b border-gray-200 p-6 dark:border-gray-800 md:flex-row md:items-center md:justify-between">
    <div class="flex items-center gap-3">
      <div class="rounded-lg bg-brand-50 p-2 text-brand-600 dark:bg-brand-500/10 dark:text-brand-400">
        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 5h16M4 12h16M4 19h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
        </svg>
      </div>
      <div>
        <h1 class="text-xl font-semibold text-gray-800 dark:text-white">Canales</h1>
        <p class="text-sm text-gray-500 dark:text-gray-400">Administra las conexiones de tus canales de comunicación.</p>
      </div>
    </div>

    <button
      type="button"
      class="flex items-center justify-center gap-2 rounded-lg bg-brand-500 px-4 py-2 text-sm font-semibold text-white hover:bg-brand-600"
      (click)="openCreateForm()"
    >
      <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
      </svg>
      Nueva conexión
    </button>
  </div>

  <!-- Búsqueda rápida -->
  <div class="border-b border-gray-200 p-3 dark:border-gray-800">
    <div class="relative w-full md:w-80">
      <svg
        class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-gray-400"
        viewBox="0 0 24 24"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
      >
        <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.6" />
        <path d="m20 20-3-3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
      </svg>
      <input
        type="text"
        placeholder="Buscar por nombre o External ID..."
        [value]="searchTerm()"
        (input)="searchTerm.set($any($event.target).value)"
        class="h-9 w-full rounded-lg border border-gray-300 bg-gray-50 pl-9 pr-8 text-sm text-gray-700 placeholder:text-gray-400 focus:border-brand-500 focus:outline-none focus:ring-1 focus:ring-brand-500 dark:border-gray-700 dark:bg-gray-800 dark:text-white"
      />
      @if (searchTerm()) {
        <button
          type="button"
          class="absolute right-2.5 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 dark:hover:text-gray-300"
          (click)="searchTerm.set('')"
          aria-label="Limpiar búsqueda"
        >
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
          </svg>
        </button>
      }
    </div>
  </div>

  <!-- Filtros -->
  <div class="flex flex-wrap items-end gap-4 border-b border-gray-200 bg-gray-50 p-4 dark:border-gray-800 dark:bg-white/[0.02]">
    <div>
      <label class="mb-1 block text-xs font-medium text-gray-500 dark:text-gray-400">Canal</label>
      <select
        [value]="selectedChannelId()"
        (change)="onChannelFilterChange($any($event.target).value)"
        class="rounded-lg border border-gray-300 bg-white px-3 py-2 text-sm text-gray-900 focus:border-brand-500 focus:outline-none focus:ring-1 focus:ring-brand-500 dark:border-gray-700 dark:bg-gray-800 dark:text-white"
      >
        <option value="0">Todos</option>
        @for (channel of channels(); track channel.id) {
          <option [value]="channel.id">{{ channel.name }}</option>
        }
      </select>
    </div>

    <div>
      <label class="mb-1 block text-xs font-medium text-gray-500 dark:text-gray-400">Estado</label>
      <select
        [value]="statusFilter()"
        (change)="onStatusFilterChange($any($event.target).value)"
        class="rounded-lg border border-gray-300 bg-white px-3 py-2 text-sm text-gray-900 focus:border-brand-500 focus:outline-none focus:ring-1 focus:ring-brand-500 dark:border-gray-700 dark:bg-gray-800 dark:text-white"
      >
        <option value="all">Todos</option>
        <option value="active">Activo</option>
        <option value="inactive">Inactivo</option>
      </select>
    </div>

    @if (hasActiveFilters()) {
      <button
        type="button"
        class="flex items-center gap-1.5 rounded-lg border border-gray-300 bg-white px-3 py-2 text-sm font-medium text-gray-600 hover:bg-gray-50 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-300 dark:hover:bg-white/5"
        (click)="clearFilters()"
        title="Limpiar filtros"
      >
        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
        </svg>
        Limpiar filtros
      </button>
    }
  </div>

  @if (errorMessage()) {
    <p class="m-4 rounded-md bg-red-50 px-3 py-2 text-sm font-medium text-red-700">{{ errorMessage() }}</p>
  }

  @if (isLoading()) {
    <p class="p-6 text-sm text-gray-500 dark:text-gray-400">Cargando...</p>
  } @else {
    <app-connections-list
      [connections]="filteredConnections()"
      (edit)="openEditForm($event)"
      (delete)="onDelete($event)"
    />
  }
</div>

@if (isFormOpen()) {
  <app-connection-form
    [channels]="channels()"
    [connection]="editingConnection()"
    (saved)="onSaved()"
    (cancel)="closeForm()"
  />
}
