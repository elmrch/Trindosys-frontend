<div class="-m-4 flex h-[calc(100vh-4rem)] flex-col border border-gray-200 bg-white md:-m-6 dark:border-gray-800 dark:bg-white/[0.03]">
  <div class="flex items-center justify-between border-b border-gray-200 px-6 py-4 dark:border-gray-800">
    <div class="flex items-center gap-3">
      <div class="rounded-lg bg-brand-50 p-2 text-brand-600 dark:bg-brand-500/10 dark:text-brand-400">
        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          <polyline points="14,2 14,8 20,8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          <line x1="16" y1="13" x2="8" y2="13" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          <line x1="16" y1="17" x2="8" y2="17" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          <polyline points="10,9 9,9 8,9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div>
        <h1 class="text-xl font-semibold text-gray-800 dark:text-white">Plantillas</h1>
        <p class="text-sm text-gray-500 dark:text-gray-400">Administra tus plantillas de mensajes.</p>
      </div>
    </div>
    <button
      type="button"
      class="flex items-center justify-center gap-2 rounded-lg bg-brand-500 px-4 py-2 text-sm font-semibold text-white hover:bg-brand-600"
      (click)="openEditor()"
    >
      <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      Nueva Plantilla
    </button>
  </div>

  @if (isLoading()) {
    <p class="p-6 text-sm text-gray-500 dark:text-gray-400">Cargando...</p>
  } @else if (templates().length === 0) {
    <div class="flex flex-1 flex-col items-center justify-center gap-3 p-12 text-center">
      <div class="rounded-full bg-gray-100 p-4 dark:bg-gray-800">
        <svg class="h-8 w-8 text-gray-400" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          <polyline points="14,2 14,8 20,8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <p class="text-sm text-gray-500 dark:text-gray-400">No hay plantillas creadas.</p>
      <button
        type="button"
        class="text-sm font-medium text-brand-500 hover:text-brand-600"
        (click)="openEditor()"
      >
        Crear plantilla
      </button>
    </div>
  } @else {
    <div class="min-h-0 flex-1 overflow-y-auto">
      <table class="w-full">
        <thead class="sticky top-0 bg-gray-50 dark:bg-gray-900/50">
          <tr class="border-b border-gray-200 text-left text-xs font-medium uppercase tracking-wider text-gray-500 dark:border-gray-800 dark:text-gray-400">
            <th class="px-6 py-3">Nombre</th>
            <th class="px-6 py-3">Estado</th>
            <th class="px-6 py-3">Fecha</th>
            <th class="px-6 py-3 text-right">Acciones</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-gray-100 dark:divide-gray-800">
          @for (t of templates(); track t.id) {
            <tr class="cursor-pointer transition-colors hover:bg-gray-50 dark:hover:bg-white/[0.02]" (click)="openEditor(t.id)">
              <td class="px-6 py-4">
                <span class="text-sm font-medium text-gray-800 dark:text-white">{{ t.nombre }}</span>
              </td>
              <td class="px-6 py-4">
                <span class="inline-flex items-center rounded-full bg-green-50 px-2 py-0.5 text-xs font-medium text-green-700 dark:bg-green-500/10 dark:text-green-400">
                  {{ t.estado }}
                </span>
              </td>
              <td class="px-6 py-4 text-sm text-gray-500 dark:text-gray-400">
                {{ formatDate(t.createdAt) }}
              </td>
              <td class="px-6 py-4 text-right">
                <button
                  type="button"
                  class="rounded p-1 text-gray-400 hover:text-red-500"
                  (click)="onDelete(t); $event.stopPropagation()"
                >
                  <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <polyline points="3,6 5,6 21,6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                </button>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  }
</div>
