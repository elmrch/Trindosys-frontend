<div class="fixed inset-0 z-50 flex items-center justify-center bg-gray-900/50 p-4" (click)="cancel.emit()">
  <div
    class="w-full max-w-lg overflow-hidden rounded-md border border-gray-200 bg-white shadow-sm dark:border-gray-800 dark:bg-gray-900"
    (click)="$event.stopPropagation()"
  >
    <div class="flex items-center justify-between gap-3 border-b border-gray-200 bg-white px-5 py-3.5 dark:border-gray-800 dark:bg-gray-900">
      <div class="flex items-center gap-2.5">
        <span class="flex h-7 w-7 items-center justify-center rounded-md bg-blue-50 text-blue-600 dark:bg-blue-500/10 dark:text-blue-400">
          <svg class="h-4 w-4 text-gray-400" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 19V9m6 10V5m6 14v-6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </span>
        <h2 class="text-sm font-semibold text-gray-900 dark:text-white">
          {{ isEditMode() ? 'Editar oportunidad' : 'Nueva oportunidad' }}
        </h2>
      </div>
      <button
        type="button"
        class="rounded p-1 text-gray-400 hover:bg-gray-100 hover:text-gray-600 dark:hover:bg-white/5 dark:hover:text-gray-200"
        (click)="cancel.emit()"
        aria-label="Cerrar"
      >
        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
        </svg>
      </button>
    </div>

    <div class="p-5">
    <form class="space-y-3.5" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
      @if (errorMessage()) {
        <p class="rounded-md bg-red-50 px-3 py-2 text-xs font-medium text-red-700">{{ errorMessage() }}</p>
      }

      <div>
        <label class="mb-1 block text-xs uppercase tracking-wide text-gray-500 dark:text-gray-400">Cliente</label>
        <select
          formControlName="customerId"
          class="w-full rounded-md border border-gray-300 bg-white px-3 py-1.5 text-sm text-gray-900 focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500 dark:border-gray-700 dark:bg-gray-800 dark:text-white"
        >
          <option [ngValue]="0" disabled>Selecciona un cliente</option>
          @for (customer of customers(); track customer.id) {
            <option [ngValue]="customer.id">{{ customer.name }}</option>
          }
        </select>
        @if (form.controls.customerId.invalid && form.controls.customerId.touched) {
          <p class="mt-1 text-xs font-medium text-red-600">Selecciona un cliente.</p>
        }
      </div>

      <div>
        <label class="mb-1 block text-xs uppercase tracking-wide text-gray-500 dark:text-gray-400">Asesor (opcional)</label>
        <select
          formControlName="advisorId"
          class="w-full rounded-md border border-gray-300 bg-white px-3 py-1.5 text-sm text-gray-900 focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500 dark:border-gray-700 dark:bg-gray-800 dark:text-white"
        >
          <option value="">Sin asignar</option>
          @for (advisor of advisors(); track advisor.id) {
            <option [value]="advisor.id">{{ advisor.fullName }}</option>
          }
        </select>
      </div>

      <div>
        <label class="mb-1 block text-xs uppercase tracking-wide text-gray-500 dark:text-gray-400">Valor estimado (opcional)</label>
        <input
          type="number"
          step="0.01"
          formControlName="estimatedValue"
          placeholder="0.00"
          class="w-full rounded-md border border-gray-300 bg-white px-3 py-1.5 text-sm text-gray-900 focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500 dark:border-gray-700 dark:bg-gray-800 dark:text-white"
        />
      </div>

      <div>
        <label class="mb-1 block text-xs uppercase tracking-wide text-gray-500 dark:text-gray-400">Descripción</label>
        <textarea
          formControlName="description"
          rows="3"
          class="w-full rounded-md border border-gray-300 bg-white px-3 py-1.5 text-sm text-gray-900 focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500 dark:border-gray-700 dark:bg-gray-800 dark:text-white"
        ></textarea>
      </div>

      <div class="flex justify-end gap-2 pt-2">
        <button
          type="button"
          class="rounded-md border border-gray-200 px-3.5 py-1.5 text-xs font-medium text-gray-600 hover:bg-gray-50 dark:border-gray-800 dark:text-gray-300 dark:hover:bg-white/5"
          (click)="cancel.emit()"
        >
          Cancelar
        </button>
        <button
          type="submit"
          [disabled]="isSubmitting()"
          class="rounded-md bg-blue-600 px-3.5 py-1.5 text-xs font-semibold text-white hover:bg-blue-700 disabled:cursor-not-allowed disabled:opacity-70"
        >
          {{ isSubmitting() ? 'Guardando...' : 'Guardar' }}
        </button>
      </div>
    </form>
    </div>
  </div>
</div>
