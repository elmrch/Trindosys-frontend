<div class="rounded-lg border border-gray-200 bg-white shadow-sm dark:border-gray-800 dark:bg-white/[0.03]">
  <!-- Header -->
  <div class="flex flex-col gap-4 border-b border-gray-200 p-6 dark:border-gray-800 md:flex-row md:items-center md:justify-between">
    <div class="flex items-center gap-3">
      <div class="rounded-lg bg-brand-50 p-2 text-brand-600 dark:bg-brand-500/10 dark:text-brand-400">
        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="18" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M16 2v4M8 2v4M3 10h18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </div>
      <div>
        <h1 class="text-xl font-semibold text-gray-800 dark:text-white">Calendario</h1>
        <p class="text-sm text-gray-500 dark:text-gray-400">Gestiona tus eventos, reuniones y recordatorios.</p>
      </div>
    </div>

    <button
      type="button"
      class="flex items-center justify-center gap-2 rounded-lg bg-brand-500 px-4 py-2 text-sm font-semibold text-white hover:bg-brand-600"
      (click)="openCreateForm()"
    >
      <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      Nuevo Evento
    </button>
  </div>

  <!-- Filters -->
  <div class="border-b border-gray-200 bg-gray-50/50 p-3 dark:border-gray-800 dark:bg-white/[0.02]">
    <div class="flex flex-wrap items-center gap-2">
      <select
        [value]="filterStatus()"
        (change)="filterStatus.set($any($event.target).value); loadEvents()"
        class="h-8 rounded-lg border border-gray-200 bg-white px-2.5 text-xs font-medium text-gray-700 focus:border-brand-500 focus:outline-none focus:ring-1 focus:ring-brand-500 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-300"
      >
        <option value="">Todos los estados</option>
        <option value="PENDIENTE">Pendiente</option>
        <option value="COMPLETADO">Completado</option>
        <option value="CANCELADO">Cancelado</option>
      </select>

      <select
        [value]="filterEventType()"
        (change)="filterEventType.set($any($event.target).value); loadEvents()"
        class="h-8 rounded-lg border border-gray-200 bg-white px-2.5 text-xs font-medium text-gray-700 focus:border-brand-500 focus:outline-none focus:ring-1 focus:ring-brand-500 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-300"
      >
        <option value="">Todos los tipos</option>
        <option value="LLAMADA">Llamada</option>
        <option value="REUNION">Reunión</option>
        <option value="VISITA">Visita</option>
        <option value="RECORDATORIO">Recordatorio</option>
        <option value="OTRO">Otro</option>
      </select>

      @if (filterStatus() || filterEventType()) {
        <button
          type="button"
          (click)="clearFilters()"
          class="flex items-center gap-1 rounded-lg border border-gray-200 bg-white px-2.5 py-1.5 text-xs font-medium text-red-600 transition-colors hover:bg-red-50 dark:border-gray-700 dark:bg-gray-800 dark:text-red-400 dark:hover:bg-red-950/30"
        >
          Limpiar filtros
        </button>
      }

      <div class="ml-auto flex items-center gap-1.5">
        <span class="flex items-center gap-1 text-[10px] text-gray-400">
          <span class="h-2 w-2 rounded-full bg-blue-500"></span> Llamada
        </span>
        <span class="flex items-center gap-1 text-[10px] text-gray-400">
          <span class="h-2 w-2 rounded-full bg-emerald-500"></span> Reunión
        </span>
        <span class="flex items-center gap-1 text-[10px] text-gray-400">
          <span class="h-2 w-2 rounded-full bg-orange-500"></span> Visita
        </span>
        <span class="flex items-center gap-1 text-[10px] text-gray-400">
          <span class="h-2 w-2 rounded-full bg-amber-500"></span> Recordatorio
        </span>
        <span class="flex items-center gap-1 text-[10px] text-gray-400">
          <span class="h-2 w-2 rounded-full bg-gray-400"></span> Otro
        </span>
      </div>
    </div>
  </div>

  @if (isLoading()) {
    <p class="p-6 text-sm text-gray-500 dark:text-gray-400">Cargando eventos...</p>
  } @else {
    <app-calendar-grid
      [events]="events()"
      [initialDate]="currentDate()"
      (dateChange)="onDateChange($event)"
      (eventClick)="onEventClick($event)"
      (createEvent)="onDateClick($event)"
    />
  }
</div>

@if (isFormOpen()) {
  <app-calendar-event-form
    [event]="editingEvent()"
    [selectedDate]="selectedDate()"
    (saved)="onSaved()"
    (cancel)="closeForm()"
  />
}

@if (isDetailOpen() && selectedEvent()) {
  <app-calendar-event-detail
    [event]="selectedEvent()!"
    (close)="closeDetail()"
    (edit)="openEditForm($event)"
    (deleted)="onEventDeleted()"
    (statusChanged)="onStatusChanged($event)"
  />
}
