<div class="-m-4 h-[calc(100vh-4rem)] md:-m-6">

  @if (errorMessage()) {
    <p class="mb-3 rounded-md bg-red-50 px-3 py-2 text-sm font-medium text-red-700">{{ errorMessage() }}</p>
  }

  <div
    class="grid h-full min-h-0 grid-cols-1 gap-0"
    [class]="isProfilePanelOpen() ? 'lg:grid-cols-[320px_1fr_280px]' : 'lg:grid-cols-[320px_1fr]'"
  >
    <app-unified-inbox
      class="min-h-0"
      [conversations]="conversations()"
      [selectedId]="selectedConversation()?.id ?? null"
      [advisors]="advisors()"
      [canAssign]="canAssign()"
      [currentAdvisorId]="currentAdvisorId()"
      [statusFilter]="statusFilter()"
      [onlyMine]="onlyMine()"
      (select)="selectConversation($event)"
      (assign)="assignAdvisor($event)"
      (statusFilterChange)="setStatusFilter($event)"
      (onlyMineToggle)="toggleOnlyMine()"
    />
    <app-chat-panel
      class="min-h-0"
      [conversation]="selectedConversation()"
      [messages]="messages()"
      [hasMoreOlder]="hasMoreOlder()"
      [isLoadingOlder]="isLoadingOlder()"
      [isSending]="isSending()"
      (send)="sendMessage($event)"
      (sendAttachments)="sendAttachments($event)"
      (loadOlder)="loadOlderMessages()"
      (statusChange)="changeStatus($event)"
      (toggleProfile)="toggleProfilePanel()"
      (archiveToggle)="toggleArchive($event)"
      (markUnread)="markConversationUnread($event)"
      (blockToggle)="toggleBlock($event)"
      (exportChat)="exportConversation($event)"
    />
    @if (isProfilePanelOpen()) {
      <app-customer-profile-panel class="hidden min-h-0 lg:block" [customerId]="selectedConversation()?.customer?.id ?? null" />
    }
  </div>
</div>
